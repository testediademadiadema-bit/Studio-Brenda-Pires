            { id: 1, category: "Unhas", name: "Manicure Completa & Esmaltação", price: 35.00, desc: "Cutilagem minuciosa, tratamento hidratante e esmaltação impecável com marcas de alta durabilidade.", image: "https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=600&q=80" },

            { id: 4, category: "Alongamento", name: "Alongamento de Unhas em Gel", price: 120.00, desc: "Técnica avançada em gel com acabamento natural, alta resistência, brilho intenso e formato personalizado.", image: "https://images.unsplash.com/photo-1599940824399-b87987ceb72a?auto=format&fit=crop&w=600&q=80" },

        const reviewsData = [
            { name: "Camila Ribeiro", rating: 5, date: "Há 3 dias", comment: "Simplesmente impecável! O Studio é super aconchegante, a Brenda é extremamente cuidadosa e o resultado das minhas unhas em gel superou todas as expectativas. Recomendo muito!" },
            { name: "Juliana Martins", rating: 5, date: "Há 1 semana", comment: "Fiz extensão de cílios e design de sobrancelhas. Meu olhar transformou totalmente! Material de altíssima qualidade e atendimento pontual e acolhedor." },

        ];

        let currentTab = 'home';
        let cart = [];
        let activeCategoryFilter = 'Todos';

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('home');
        });

        function switchTab(tabName) {
            currentTab = tabName;
            
            const tabs = ['home', 'servicos', 'agenda', 'sobre', 'avaliacoes'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tabName ? "flex flex-col items-center text-brand-600 transition scale-105 font-semibold" : "flex flex-col items-center text-neutral-400 hover:text-brand-600 transition";
                }
                const dBtn = document.getElementById(`desktop-nav-${t}`);
                if (dBtn) {
                    dBtn.className = t === tabName ? "hover:text-brand-gold transition py-1 border-b-2 border-brand-gold text-white font-bold" : "hover:text-brand-gold transition py-1 border-b-2 border-transparent text-neutral-300";
                }
            });

            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            if (tabName === 'home') renderHome(main);
            else if (tabName === 'servicos') renderServices(main);
            else if (tabName === 'agenda') renderAgenda(main);
            else if (tabName === 'sobre') renderAbout(main);
            else if (tabName === 'avaliacoes') renderReviews(main);

            updateBadge();
        }

        function updateBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const badgeCart = document.getElementById('badge-cart');
            const badgeNav = document.getElementById('badge-nav');
            const badgeDesktopNav = document.getElementById('badge-desktop-nav');

            if (totalItems > 0) {
                badgeCart.innerText = totalItems;
                badgeCart.classList.remove('hidden');
                badgeNav.innerText = totalItems;
                badgeNav.classList.remove('hidden');
                badgeDesktopNav.innerText = totalItems;
                badgeDesktopNav.classList.remove('hidden');
            } else {
                badgeCart.classList.add('hidden');
                badgeNav.classList.add('hidden');
                badgeDesktopNav.classList.add('hidden');
            }
        }

        async function consultarCep(cep) {
            const cleanCep = cep.replace(/\D/g, '');
            if (cleanCep.length !== 8) return;
            try {
                const response = await fetch(`https://viacep.com.br/ws/${cleanCep}/json/`);
                const data = await response.json();
                if (!data.erro) {
                    document.getElementById('client-address').value = data.logradouro || '';
                    document.getElementById('client-neighborhood').value = data.bairro || '';
                }
            } catch (err) {
                console.error("Erro ao consultar CEP:", err);
            }
        }

        function addServiceDirect(id) {
            const item = servicesData.find(s => s.id === id);
            if (!item) return;
            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateBadge();
            switchTab('agenda');
        }

        function changeQty(id, delta) {
            const index = cart.findIndex(i => i.id === id);
            if (index !== -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) cart.splice(index, 1);
            }
            renderAgenda(document.getElementById('main-content'));
            updateBadge();
        }

            let itemsText = cart.map(i => `• ${i.qty}x ${i.name} (R$ ${(i.price * i.qty).toFixed(2).replace('.', ',')})`).join('\n');

            let message = `*✨ NOVO AGENDAMENTO - STUDIO BRENDA PIRES ✨*\n\n`;
            message += `👤 *Cliente:* ${name}\n`;
            message += `📍 *Morada:* ${address}, ${number}${complement ? ' - ' + complement : ''} (${neighborhood}) - CEP: ${cep}\n`;
            message += `📅 *Data/Horário:* ${date.split('-').reverse().join('/')} às ${time}\n`;
            message += `💳 *Forma de Pagamento:* ${payment}\n\n`;
            message += `🛍️ *Serviços Selecionados:*\n${itemsText}\n\n`;
            message += `💰 *Total Estimado:* R$ ${total.toFixed(2).replace('.', ',')}\n`;
            if (obs) message += `💬 *Observações:* ${obs}\n`;

            const encoded = encodeURIComponent(message);
            window.open(`https://wa.me/${studioInfo.whatsappNumber}?text=${encoded}`, '_blank');
        }
    </script>
</body>
</html>
